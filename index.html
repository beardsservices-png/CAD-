<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Draft Studio — Design & Drafting</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">▦</span>
        <span>Draft Studio</span>
        <span id="project-name" class="project-name"></span>
      </div>
      <div class="file-actions">
        <button id="btn-undo" class="ghost" title="Undo (Ctrl/⌘+Z)">↶ Undo</button>
        <button id="btn-redo" class="ghost" title="Redo (Ctrl/⌘+Shift+Z)">↷ Redo</button>
        <span class="tb-div"></span>
        <button id="btn-new" class="ghost">New</button>
        <button id="btn-projects" class="ghost" hidden>Projects</button>
        <button id="btn-cloud-save" class="ghost primary" hidden>Cloud Save</button>
        <button id="btn-open" class="ghost">Open</button>
        <button id="btn-save" class="ghost">Export JSON</button>
        <button id="btn-png" class="ghost">PNG</button>
        <button id="btn-svg" class="ghost">SVG</button>
        <button id="btn-materials" class="ghost">Materials</button>
        <button id="btn-fit" class="ghost">Fit</button>
        <button id="btn-3d" class="ghost primary">3D View</button>
        <button id="btn-panel" class="ghost" title="Show/hide side panel (Tab)">⇥ Panel</button>
        <input id="file-input" type="file" accept=".json" hidden />
      </div>
    </header>

    <div id="projects-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h2>Cloud Projects</h2>
          <button id="btn-projects-close" class="ghost">Close</button>
        </div>
        <div class="modal-actions">
          <button id="btn-save-as" class="ghost primary">＋ Save current as new</button>
          <span id="storage-note" class="muted"></span>
        </div>
        <div id="projects-list" class="projects-list"></div>
      </div>
    </div>

    <div id="materials-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h2>Materials List</h2>
          <button id="btn-materials-close" class="ghost">Close</button>
        </div>
        <div class="modal-actions">
          <button id="btn-materials-copy" class="ghost primary">Copy as text</button>
          <span class="muted">Counts reflect visible layers</span>
        </div>
        <div id="materials-list" class="projects-list"></div>
      </div>
    </div>

    <div class="workspace">
      <nav class="toolbar" aria-label="Tools">
        <button class="tool-btn active" data-tool="select" title="Select (V)"><span>▲</span><small>Select</small></button>
        <button class="tool-btn" data-tool="line" title="Line (L)"><span>╱</span><small>Line</small></button>
        <button class="tool-btn" data-tool="wall" title="Wall (W)"><span>▬</span><small>Wall</small></button>
        <button class="tool-btn" data-tool="rect" title="Rectangle (R)"><span>▭</span><small>Rect</small></button>
        <button class="tool-btn" data-tool="circle" title="Circle (C)"><span>◯</span><small>Circle</small></button>
        <button class="tool-btn" data-tool="arc" title="Arc (A)"><span>◜</span><small>Arc</small></button>
        <button class="tool-btn" data-tool="polygon" title="Polygon (P)"><span>⬠</span><small>Polygon</small></button>
        <button class="tool-btn" data-tool="dimension" title="Dimension (D)"><span>↔</span><small>Dim</small></button>
        <button class="tool-btn" data-tool="text" title="Text (T)"><span>T</span><small>Text</small></button>
        <button class="tool-btn" data-tool="measure" title="Measure (M)"><span>⟺</span><small>Measure</small></button>
      </nav>

      <main class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="hint" class="hint"></div>
      </main>

      <aside class="panel">
        <section>
          <h3>Properties</h3>
          <div id="props" class="card"></div>
        </section>

        <section>
          <h3>Shape Library</h3>
          <input id="shape-search" class="search" type="search" placeholder="Search shapes…" />
          <div id="shape-lib"></div>
        </section>

        <section>
          <h3>Takeoff</h3>
          <div id="takeoff" class="card"></div>
        </section>

        <section>
          <h3>Layers</h3>
          <div id="layers" class="card"></div>
        </section>

        <section>
          <h3>Settings</h3>
          <div class="card">
            <label class="opt inline">Units
              <select id="unit-mode">
                <option value="imperial">Imperial (ft/in)</option>
                <option value="metric">Metric (mm)</option>
              </select>
            </label>
            <label class="opt"><input id="snap-grid" type="checkbox" /> Grid snap</label>
            <label class="opt"><input id="snap-endpoint" type="checkbox" /> Endpoint / midpoint</label>
            <label class="opt"><input id="snap-align" type="checkbox" /> Alignment guides</label>
            <label class="opt"><input id="snap-ortho" type="checkbox" /> Ortho lock</label>
            <label class="opt inline"><span id="grid-step-label">Grid step (in)</span> <input id="grid-step" type="number" min="0.1" step="0.25" /></label>
            <label class="opt inline"><span id="wall-thick-label">Wall thickness (in)</span> <input id="wall-thick" type="number" min="0.5" step="0.5" /></label>
          </div>
        </section>
      </aside>
    </div>

    <div id="view3d" class="overlay hidden">
      <canvas id="canvas3d"></canvas>
      <div class="overlay-bar">
        <div><strong>3D Preview</strong> · massing model</div>
        <div class="o-views">
          <button class="ghost" data-view="top">Top</button>
          <button class="ghost" data-view="front">Front</button>
          <button class="ghost" data-view="right">Right</button>
          <button class="ghost" data-view="left">Left</button>
          <button class="ghost" data-view="iso">Iso</button>
        </div>
        <div class="o-right">
          <span class="o-hint">drag to orbit · scroll to zoom</span>
          <button id="btn-export-stl" class="ghost" title="Export mesh for 3D printing">STL</button>
          <button id="btn-export-obj" class="ghost" title="Export mesh for games / Blender">OBJ</button>
          <button id="btn-3d-fit" class="ghost">Recenter</button>
          <button id="btn-3d-close" class="ghost">Close</button>
        </div>
      </div>
    </div>

    <footer class="statusbar">
      <span id="coords">X 0"   Y 0"</span>
      <span class="spacer"></span>
      <div id="step-ctl" class="step-ctl" hidden>
        <span class="step-title">Build step</span>
        <button id="step-prev" title="Previous step">‹</button>
        <span id="step-label">All</span>
        <button id="step-next" title="Next step">›</button>
      </div>
      <span id="zoom">100%</span>
    </footer>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
